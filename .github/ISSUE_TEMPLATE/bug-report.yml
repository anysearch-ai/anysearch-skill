name: Bug Report
description: Create a report to help us reproduce and fix bugs
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out the form to submit bug report.
        Please do not include API keys or other sensitive information.
  - type: textarea
    id: description
    attributes:
      label: What happened？
      description: Describe the issue you encountered, including any error messages or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide the steps needed to reproduce the issue.
      placeholder: Leave a comment
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: How are you using AnySearch?
      description: 
      options:
        - API
        - MCP
        - Skill
        - Third-party integration
        - Other
    validations:
      required: true
  - type: textarea
    id: request_details
    attributes:
      label: Request Details
      description: Please provide relevant details, such as endpoint, request ID, request time, version, or agent/framework.
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any relevant queries, screenshots, or other related information.
      placeholder: Leave a comment
